<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockBaza | Ilovani yuklab olish</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C4FF6">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="text-align:center;">
      <img src="icons/icon-192.png" alt="MockBaza" style="width:80px;height:80px;border-radius:20px;margin:0 auto 20px;display:block;box-shadow:var(--shadow);">
      <h1>MockBaza</h1>
      <p class="sub" id="statusText">Ilovani telefoningizga o'rnatib oling.</p>

      <button class="btn" id="installBtn" style="display:none;">📲 Ilovani yuklab olish</button>

      <div id="doneBox" style="display:none;">
        <div style="font-size:40px;margin-bottom:6px;">✅</div>
        <p style="color:var(--green);font-weight:800;">Ilova o'rnatildi!</p>
      </div>

      <div id="waitBox" style="display:none;color:var(--muted);font-size:13.5px;">
        <div class="spinner" style="width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:0 auto 10px;animation:spin 0.8s linear infinite;"></div>
        Tayyorlanmoqda... bir necha soniya kuting.
      </div>

      <div id="manualBox" style="display:none;color:var(--muted);font-size:13.5px;line-height:1.6;text-align:left;background:var(--purple-light);padding:14px 16px;border-radius:12px;">
        Brauzeringiz avtomatik o'rnatishni ko'rsatmadi. Buni sinab ko'ring:<br>
        ⋮ menyu (yuqori o'ng burchakda) → <strong>"O'rnatish"</strong> yoki <strong>"Add to Home screen"</strong>.
      </div>

      <a href="index.html" class="btn ghost small" style="margin-top:20px;">Kirish sahifasiga o'tish</a>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }

    const installBtn = document.getElementById("installBtn");
    const statusText = document.getElementById("statusText");
    const doneBox = document.getElementById("doneBox");
    const waitBox = document.getElementById("waitBox");
    const manualBox = document.getElementById("manualBox");

    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

    let deferredPrompt = null;

    function showInstalled() {
      installBtn.style.display = "none";
      waitBox.style.display = "none";
      manualBox.style.display = "none";
      statusText.style.display = "none";
      doneBox.style.display = "";
    }

    if (isStandalone) {
      showInstalled();
    } else if (isIOS) {
      // iOS never fires beforeinstallprompt — go straight to manual instructions
      statusText.textContent = "iPhone/iPad uchun qo'lda o'rnatish kerak:";
      manualBox.innerHTML = `
        1. Pastdagi ulashish (Share) tugmasini bosing<br>
        2. <strong>"Add to Home Screen"</strong> ni tanlang<br>
        3. <strong>"Add"</strong> ni bosing`;
      manualBox.style.display = "";
    } else {
      // Android/desktop Chrome: wait briefly for the browser's install signal
      waitBox.style.display = "";
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        waitBox.style.display = "none";
        installBtn.style.display = "";
      });

      setTimeout(() => {
        if (!deferredPrompt && !isStandalone) {
          waitBox.style.display = "none";
          manualBox.style.display = "";
        }
      }, 2500);
    }

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (choice.outcome === "accepted") {
        showInstalled();
      }
    });

    window.addEventListener("appinstalled", showInstalled);
  </script>
</body>
</html>
